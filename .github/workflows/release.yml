name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: clang
      HOST_CC: clang
      DASHBORNE_CC: clang
      DASHBORNE_LD: ld.lld
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld python3 zlib1g-dev 7zip e2fsprogs
      - name: Build ARM loader and bundled extensions
        run: sh dashborne/build.sh
      - name: Run tests
        run: sh test.sh
      - name: Package release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 tools/release.py --tag "$REF_NAME"
          else
            python3 tools/release.py
          fi
      - name: Save download package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Dashborne-microSD
          path: dashborne/build/release/
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Dashborne-microSD
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_TITLE=$(cat release/release-title.txt)
          gh release create "$RELEASE_TAG" release/*.zip release/SHA256SUMS \
            --verify-tag --title "$RELEASE_TITLE" \
            --notes-file release/release-notes.md
