name: Stock OS preflight

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      force_review:
        description: Review this image again and update its existing issue
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: stock-os-preflight
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    outputs:
      review: ${{ steps.existing.outputs.review }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check configuration
        id: configured
        env:
          DASH_DEVICE_ID: ${{ secrets.DASH_DEVICE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$DASH_DEVICE_ID" ] || [ -z "$OPENAI_API_KEY" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Add repository Actions secrets DASH_DEVICE_ID and OPENAI_API_KEY, then run this workflow again.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch the offered display update
        if: steps.configured.outputs.ready == 'true'
        env:
          DASH_DEVICE_ID: ${{ secrets.DASH_DEVICE_ID }}
        run: python3 -m tools.stock_update.audit fetch --work "$RUNNER_TEMP/dashborne-stock-audit"
      - name: Check for an existing audit issue
        if: steps.configured.outputs.ready == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_REVIEW: ${{ inputs.force_review || false }}
        run: |
          args=()
          if [ "$FORCE_REVIEW" = true ]; then args+=(--force); fi
          python3 -m tools.stock_update.audit check --work "$RUNNER_TEMP/dashborne-stock-audit" "${args[@]}"
      - name: Install filesystem inspection tools
        if: steps.existing.outputs.review == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip binutils
      - name: Inspect image and current adapters
        if: steps.existing.outputs.review == 'true'
        run: python3 -m tools.stock_update.audit inspect --work "$RUNNER_TEMP/dashborne-stock-audit"
      - name: Prepare Codex instructions and output schema
        if: steps.existing.outputs.review == 'true'
        run: python3 -m tools.stock_update.audit prepare --work "$RUNNER_TEMP/dashborne-stock-audit"
      - name: Create a compatibility plan with Codex
        if: steps.existing.outputs.review == 'true'
        uses: openai/codex-action@306c6a196a99dcc6582530c396a19d2672d5e9ec # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          model: ${{ vars.STOCK_AUDIT_MODEL }}
          prompt-file: ${{ runner.temp }}/dashborne-stock-audit/prompt.txt
          output-schema-file: ${{ runner.temp }}/dashborne-stock-audit/review-schema.json
          output-file: ${{ runner.temp }}/dashborne-stock-audit/codex-review.json
      - name: Validate the compatibility plan
        if: steps.existing.outputs.review == 'true'
        env:
          STOCK_AUDIT_MODEL: ${{ vars.STOCK_AUDIT_MODEL }}
        run: python3 -m tools.stock_update.audit finish --work "$RUNNER_TEMP/dashborne-stock-audit"
      - name: Save issue report
        if: steps.existing.outputs.review == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stock-preflight-report
          path: ${{ runner.temp }}/dashborne-stock-audit/report.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary firmware and analysis
        if: always()
        run: rm -rf "$RUNNER_TEMP/dashborne-stock-audit"

  publish:
    needs: inspect
    if: needs.inspect.outputs.review == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: stock-preflight-report
          path: ${{ runner.temp }}/dashborne-stock-report
      - name: Create or update the compatibility issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.stock_update.audit publish --work "$RUNNER_TEMP/dashborne-stock-report"
